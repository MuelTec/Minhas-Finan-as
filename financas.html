<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas finanças</title>
<link rel="icon" id="favicon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="webicons/apple-touch-icon.png">
<meta name="theme-color" content="#0F1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minhas Finanças">
<style>
:root{--bg:#0F1226;--sf:#171B36;--ink:#EEF1FF;--mut:#8B93B8;--ac:#22E1D0;--on:#06202A;--ex:#F26BD9;--ln:#262B4D;--tint:#202547;--g1:linear-gradient(135deg,#D56EF5,#9A6BEA);--g2:linear-gradient(135deg,#22E8D4,#3F7FE8);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}


*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 0% 0%,#3B2A6B 0,transparent 45%),radial-gradient(circle at 100% 75%,#114557 0,transparent 40%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.mb{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mb b{font-size:18px;font-weight:600}
.ib{border:1px solid var(--ln);background:var(--sf);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
h1{font-size:26px;line-height:1.2;font-weight:600;margin:6px 0 14px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;margin:22px 0 8px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.gc{border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden}
.gc:after{content:"";position:absolute;right:-22px;bottom:-34px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.16)}
.gc small{font-size:14px;opacity:.92}.gc b{display:block;font-size:22px;margin-top:8px}
.mu{color:var(--mut);font-size:13px}
.in{color:var(--ac)}.out{color:var(--ex)}
.r{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.r:last-child{border-bottom:0}
.r .t{flex:1;min-width:0}.r .t div:first-child{font-weight:500;overflow-wrap:anywhere}
.r .v{font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--tint);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--g2);border-radius:4px}
.b{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:11px 16px;font:inherit;font-weight:500;cursor:pointer}
.b.p{background:var(--g1);color:#fff;border-color:transparent}
.b.d{color:var(--ex);margin-right:auto}
.b.w{width:100%}
.em{color:var(--mut);padding:10px 0;font-size:14px}
.dt{width:48px;text-align:center;border-radius:10px;background:var(--tint);padding:5px 0;line-height:1.1;flex:none}
.dt b{display:block;font-size:20px}.dt span{font-size:12px;color:var(--mut)}
.dn{opacity:.5}.dn .t div:first-child{text-decoration:line-through}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:14px 0 12px;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ac);border-top-color:var(--ac);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden]{display:none}
.sh{background:var(--sf);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px}
.ac{display:flex;gap:8px;margin-top:16px}
#er{color:var(--ex);font-size:14px;min-height:20px;margin-top:8px}
#pv{font-size:14px;background:var(--tint);border-radius:10px;padding:10px;margin-top:10px}
.cc{aspect-ratio:1.586;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 18px rgba(0,0,0,.18);margin-bottom:12px;cursor:pointer}
.cc .bn{font-weight:700;font-size:22px;letter-spacing:-.01em}
.cc .ch{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f3d98b,#c49a3a)}
.cc .ft{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px}
.cc .ft b{font-size:20px;display:block}
.cs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px}
.cs button{flex:none;border:2px solid transparent;border-radius:10px;width:84px;height:44px;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
.cs button.on{border-color:var(--ink)}
.pk{display:flex;gap:8px}
.pk button{flex:1;aspect-ratio:1.586;border-radius:10px;border:3px solid transparent;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.pk button.on{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="ov" id="ov" hidden><div class="sh" id="sh"></div></div>
<div class="ov" id="lks" hidden style="z-index:20;background:var(--bg,#0F1226);align-items:center">
 <div style="width:100%;max-width:340px;text-align:center;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px))">
  <div style="font-size:22px;font-weight:800">🔒 Minhas Finanças</div>
  <div id="lk_sub" class="mu" style="margin-top:6px">Digite seu PIN de 4 dígitos</div>
  <div id="lk_dots" style="font-size:30px;letter-spacing:12px;margin:16px 0 2px;color:var(--ac)"></div>
  <div id="lk_err" style="color:var(--ex);min-height:20px;font-size:13px"></div>
  <div id="lk_pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px auto 0;max-width:260px"></div>
  <div style="margin-top:14px"><button class="b w" style="max-width:260px" onclick="lockForgot()">🔑 Esqueci o PIN</button></div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('fin1'))}catch(e){}
S=S||{tx:[],buys:[],cards:[],ev:[],bud:{}};
if(!S.bud||typeof S.bud!=='object')S.bud={};
if(!S.cards){S.cards=S.card&&S.buys.length?[{id:1,brand:'neon',close:S.card.close,due:S.card.due}]:[];S.buys.forEach(b=>b.cid=1)}
let lastBody=null;
const save=()=>{try{
  // Só persiste (e sincroniza) se os dados realmente mudaram
  const prev=S.upd;S.upd=0;const body=JSON.stringify(S);S.upd=prev;
  if(body===lastBody)return;
  lastBody=body;
  S.upd=Date.now();
  localStorage.setItem('fin1',JSON.stringify(S));
  scheduleSync();
}catch(e){}};

// --- FUNÇÃO DE BACKUP DOS DADOS ---
function exportBackup(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "minhas_financas_backup_" + today() + ".json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
}

// --- RESTAURAR BACKUP (valida e aplica; retorna '' em sucesso) ---
function applyBackup(d){
  if(!d||typeof d!=='object'||Array.isArray(d)||!Array.isArray(d.tx))
    return'Arquivo inválido: não parece um backup do Minhas Finanças.';
  S=Object.assign({tx:[],buys:[],cards:[],ev:[],bud:{}},d);
  if(!Array.isArray(S.cards))S.cards=[];
  if(!Array.isArray(S.buys))S.buys=[];
  if(!Array.isArray(S.ev))S.ev=[];
  if(!S.bud||typeof S.bud!=='object')S.bud={};
  save();render();
  return'';
}
function importBackup(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d=null;try{d=JSON.parse(rd.result)}catch(e){}
      const err=applyBackup(d);
      if(err)alert(err);
      else alert('Backup restaurado com sucesso! '+S.tx.length+' lançamento(s).');
    };
    rd.readAsText(f);
  };
  inp.click();
}
// --- SINCRONIZAÇÃO ENTRE APARELHOS (GitHub Gist privado) ---
const SKEY='fin_sync',GF='minhas-financas.json',GD='Minhas Finanças backup';
function syncCfg(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}}
function setSyncCfg(c){try{c?localStorage.setItem(SKEY,JSON.stringify(c)):localStorage.removeItem(SKEY)}catch(e){}}
let syncBusy=false,syncTimer=null;
function scheduleSync(){if(window.__noAutoSync)return;if(!syncCfg()||syncBusy)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>autoSync(),1200)}
function autoSync(){
 if(window.__noAutoSync)return;
 if(!syncCfg())return;
 // Não mexe nos dados enquanto o usuário está com um formulário aberto
 if($('#ov')&&!$('#ov').hidden)return;
 if(syncBusy){clearTimeout(syncTimer);syncTimer=setTimeout(autoSync,1200);return} // entra na fila
 syncNow().then(r=>{if((r==='atualizado'||r==='conflito-nuvem')&&$('#ov').hidden)render()}).catch(()=>{})
}
async function ghApi(method,path,body){
 const c=syncCfg();
 const r=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body==null?undefined:JSON.stringify(body)});
 if(r.status===204)return null;
 if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
 return r.json();
}
let cloudHist=[]; // versões anteriores guardadas na nuvem (desfazer)
function pushHist(data,t){
 if(!data||!Array.isArray(data.tx))return;
 if(cloudHist.length&&JSON.stringify(cloudHist[0].data)===JSON.stringify(data))return; // evita duplicata
 cloudHist.unshift({t:t||Date.now(),data:data});
 cloudHist=cloudHist.slice(0,15); // mantém as 15 versões mais recentes
}
function cloudPayload(){return JSON.stringify({v:2,upd:S.upd||Date.now(),data:S,hist:cloudHist})}
function applyRemote(p){
 // Guarda a versão local que será substituída (desfazer)
 if(S&&Array.isArray(S.tx)&&S.tx.length&&p&&p.data&&JSON.stringify(p.data)!==JSON.stringify(S))
  pushHist(JSON.parse(JSON.stringify(S)),S.upd);
 try{localStorage.setItem('fin_local_backup',JSON.stringify(S))}catch(e){}
 S=Object.assign({tx:[],buys:[],cards:[],ev:[],bud:{}},p.data||{});
 if(!S.bud||typeof S.bud!=='object')S.bud={};
 S.upd=p.upd||0;
 try{localStorage.setItem('fin1',JSON.stringify(S))}catch(e){}
 const cur=S.upd;S.upd=0;lastBody=JSON.stringify(S);S.upd=cur;
}
async function pushLocal(prevP){
 // Guarda a versão que está sendo substituída na nuvem (desfazer)
 if(prevP&&prevP.data&&Array.isArray(prevP.data.tx)&&JSON.stringify(prevP.data)!==JSON.stringify(S))
  pushHist(prevP.data,prevP.upd);
 const c=syncCfg();
 await ghApi('PATCH','/gists/'+c.gistId,{files:{[GF]:{content:cloudPayload()}}});
 c.lastSync=Date.now();setSyncCfg(c);
}
async function syncConnect(tok){
 tok=String(tok||'').trim();
 if(!tok)return'Cole o token de acesso.';
 const prev=syncCfg();
 setSyncCfg({token:tok,gistId:prev&&prev.gistId?prev.gistId:null,lastSync:0});
 try{await ghApi('GET','/user')}
 catch(e){setSyncCfg(prev||null);return e.status===401?'Token inválido ou expirado.':'Não consegui validar o token ('+e.message+').'}
 try{
  const list=await ghApi('GET','/gists?per_page=100');
  const found=(list||[]).find(g=>g.files&&g.files[GF]);
  if(found){
   setSyncCfg({token:tok,gistId:found.id,lastSync:0});
   const g=await ghApi('GET','/gists/'+found.id);
   let p=null;try{p=JSON.parse(g.files[GF].content)}catch(e){}
   if(p&&Array.isArray(p.hist))cloudHist=p.hist;
   if(p&&p.data&&Array.isArray(p.data.tx)&&p.data.tx.length){
    if(!(S.tx&&S.tx.length))applyRemote(p);
    else{
     const useLocal=confirm('Encontrei dados na nuvem E neste aparelho.\n\nOK = enviar a versão DESTE aparelho (substitui a nuvem)\nCancelar = baixar a versão da nuvem');
     if(useLocal)await pushLocal(p);else applyRemote(p);
    }
   }else await pushLocal();
   setSyncCfg(Object.assign(syncCfg(),{lastSync:Date.now()}));
   return'';
  }
  const g=await ghApi('POST','/gists',{description:GD,public:false,files:{[GF]:{content:cloudPayload()}}});
  setSyncCfg({token:tok,gistId:g.id,lastSync:Date.now()});
  return'';
 }catch(e){setSyncCfg(prev||null);return'Erro ao conectar: '+e.message}
}
async function syncNow(){
 const c=syncCfg();
 if(!c||!c.gistId||syncBusy)return null;
 syncBusy=true;
 try{
  const g=await ghApi('GET','/gists/'+c.gistId);
  const f=g.files[GF];
  let p=null;if(f){try{p=JSON.parse(f.content)}catch(e){}}
  if(p&&Array.isArray(p.hist))cloudHist=p.hist;
  const lu=S.upd||0,ru=p&&p.upd?p.upd:0;
  if(!p||!p.data||!Array.isArray(p.data.tx)){await pushLocal();return'enviado'}
  if(ru===lu){setSyncCfg(Object.assign(c,{lastSync:Date.now()}));return'em dia'}
  if(ru<lu){await pushLocal(p);return'enviado'}
  if(lu>c.lastSync){
   const useLocal=confirm('Os dados mudaram nos dois aparelhos desde a última sincronização.\n\nOK = enviar a versão DESTE aparelho\nCancelar = baixar a versão da nuvem');
   if(useLocal){await pushLocal(p);return'conflito-enviado'}
   applyRemote(p);setSyncCfg(Object.assign(syncCfg(),{lastSync:Date.now()}));return'conflito-nuvem';
  }
  applyRemote(p);setSyncCfg(Object.assign(syncCfg(),{lastSync:Date.now()}));return'atualizado';
 }catch(e){return'erro: '+e.message}
 finally{syncBusy=false}
}
function syncHtml(){
 const c=syncCfg();
 if(!c)return`<div class="cd" style="margin-top:12px"><b>🔗 Sincronizar entre aparelhos</b>
  <div class="mu" style="margin-top:6px">Use a mesma conta GitHub no Android e no iPhone para os dados ficarem iguais automaticamente.</div>
  <input id="f_tok" type="password" autocomplete="off" placeholder="Token do GitHub" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--tint);color:var(--ink);font:inherit">
  <button class="b p w" style="margin-top:8px" onclick="syncConnectUI()">🔗 Conectar e sincronizar</button>
  <div class="mu" style="font-size:12px;margin-top:8px">Criar o token (só 1 vez): abra <b>github.com/settings/tokens/new</b>, marque somente <b>gist</b> e clique em Generate. Depois copie e cole aqui.</div>
 </div>`;
 const ls=c.lastSync?new Date(c.lastSync).toLocaleString('pt-BR'):'—';
 return`<div class="cd" style="margin-top:12px"><b>🔗 Sincronização ativa</b>
  <div class="mu" style="margin-top:6px">Última sincronização: ${ls}</div>
  <div id="syncMsg" class="mu" style="font-size:12px;min-height:16px"></div>
  <button class="b p w" style="margin-top:8px" onclick="syncNowUI()">🔄 Sincronizar agora</button>
  <button class="b w" style="margin-top:8px" onclick="syncDisconnect()">Desconectar</button>
 </div>`;
}
async function syncConnectUI(){
 const el=$('#f_tok');
 const msg=await syncConnect(el?el.value:'');
 if(msg){alert(msg);return}
 render();
 const r=await syncNow();
 if(r&&r.startsWith('erro'))alert('Sincronização: '+r);
 else alert('Conectado! Dados sincronizados.');
}
async function syncNowUI(){
 const r=await syncNow();
 const txt={'enviado':'Enviado para a nuvem ✅','atualizado':'Baixado da nuvem ✅','em dia':'Tudo em dia ✅','conflito-enviado':'Enviado a versão deste aparelho ✅','conflito-nuvem':'Baixado a versão da nuvem ✅'}[r]||(r&&r.startsWith('erro')?'Erro: '+r.slice(6):'');
 const m=$('#syncMsg');
 if(m&&txt)m.textContent=txt;
 else if(txt)alert(txt);
 if(r==='atualizado'||r==='conflito-nuvem')render();
}
function syncDisconnect(){if(confirm('Desconectar a sincronização? Os dados continuam salvos neste aparelho.')){setSyncCfg(null);render()}}

// --- BLOQUEIO POR PIN (local, nunca vai para a nuvem) ---
const LKEY='fin_lock';
function lockCfg(){try{return JSON.parse(localStorage.getItem(LKEY))}catch(e){return null}}
function setLockCfg(c){try{c?localStorage.setItem(LKEY,JSON.stringify(c)):localStorage.removeItem(LKEY)}catch(e){}}
async function hashPin(p){
 const s='MFpin:'+p;
 try{
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
   const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
   return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
 }catch(e){}
 // fallback determinístico (ambientes sem crypto.subtle)
 let h1=0x811c9dc5>>>0,h2=0x1b873593>>>0;
 for(let i=0;i<s.length;i++){h1=((h1^s.charCodeAt(i))*16777619)>>>0;h2=(h2+s.charCodeAt(i)*(i+7))>>>0}
 return 'f'+h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0');
}
const recCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=A[Math.floor(Math.random()*A.length)];return s.slice(0,4)+'-'+s.slice(4)};
let lockPin='';
function lockPad(){
 const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
 $('#lk_pad').innerHTML=keys.map(k=>k===''?'<span></span>':`<button class="b" style="padding:13px 0;font-size:19px;${k==='⌫'?'':'background:var(--tint);color:var(--ink);border-color:var(--ln)'}" onclick="lockKey('${k}')">${k}</button>`).join('');
}
function lockDots(){$('#lk_dots').textContent='●'.repeat(lockPin.length)+'○'.repeat(Math.max(0,4-lockPin.length))}
function lockShow(msg){
 if(!lockCfg())return;
 lockPin='';lockPad();lockDots();
 $('#lk_err').textContent=msg||'';
 $('#lks').hidden=false;
}
function lockHide(){$('#lks').hidden=true;lockPin=''}
async function lockKey(k){
 if($('#lks').hidden)return;
 if(k==='⌫'){lockPin=lockPin.slice(0,-1);lockDots();return}
 if(lockPin.length>=4)return;
 lockPin+=k;lockDots();
 if(lockPin.length===4){
  const l=lockCfg(),h=await hashPin(lockPin);
  if(l&&h===l.h){lockHide();return}
  lockPin='';lockDots();
  $('#lk_err').textContent='PIN incorreto. Tente de novo.';
 }
}
function lockForgot(){
 const l=lockCfg();if(!l)return;
 const r=prompt('Digite o código de recuperação gerado ao ativar o bloqueio:');
 if(r==null)return;
 if(String(r).trim().toUpperCase()===String(l.r).toUpperCase()){
  setLockCfg(null);
  lockHide();
  alert('Bloqueio removido. Para ativar de novo com um PIN novo, use o botão de bloqueio no Histórico.');
  render();
 }else alert('Código de recuperação incorreto.');
}
function lockSheet(){
 const l=lockCfg();
 if(!l){
  sheet('🔒 Ativar bloqueio por PIN',
   F('Novo PIN (4 dígitos)',inp('f_p1','','inputmode="numeric" maxlength="4" type="password" autocomplete="new-password"'))+
   F('Confirmar o PIN',inp('f_p2','','inputmode="numeric" maxlength="4" type="password" autocomplete="new-password"'))+
   `<div class="mu">Com o bloqueio, quem pegar seu celular não abre seus dados. Se esquecer o PIN, o código de recuperação gerado agora é o seu salva-vidas.</div>`,
   async ()=>{
    const a=v('f_p1').trim(),b=v('f_p2').trim();
    if(!/^\d{4}$/.test(a))return'O PIN precisa ter exatamente 4 números.';
    if(a!==b)return'Os PINs não conferem.';
    const rec=recCode();
    setLockCfg({h:await hashPin(a),r:rec});
    render();
    alert('Bloqueio ativado! ✅\n\nGuarde seu código de recuperação:\n\n   '+rec+'\n\nSem ele (e sem o PIN), ninguém abre o app — nem você.');
    return'';
   });
  return;
 }
 sheet('🔒 Bloqueio por PIN (ativo)',
  `<div class="mu" style="margin-bottom:10px">O bloqueio está ativo neste aparelho. Para trocar o PIN, digite o atual. Para desativar, use o botão Excluir abaixo.</div>`+
  F('PIN atual',inp('f_old','','inputmode="numeric" maxlength="4" type="password" autocomplete="current-password"'))+

function parseNotif(txt){
 const t=String(txt||'').trim();if(!t)return null;
 const m=t.match(/R\$\s*([\d.]+,\d{2})/i)||t.match(/R\$\s*([\d.]+)/i)||t.match(/(?:^|\s)([\d.]+,\d{2})(?=\s|$)/);
 if(!m)return null;
 const a=num(m[1]);if(!(a>0))return null;
 const low=t.toLowerCase();
 const inn=['receb','credit','depos','estorn','devolv','entrada','salár','holerite'];
 const outw=['compra','pagament','pagou','débito','debito','saque','transfer','enviad','boleto','fatura','ted','assinatura','aprovad'];
 let type;
 if(inn.some(w=>low.includes(w)))type='in';
 else if(outw.some(w=>low.includes(w)))type='out';
 else if(low.includes('pix'))type=/enviad|para |realizada para|saiu/.test(low)?'out':'in';
 else type='out';
 let cat='Outros';
 if(type=='in')cat=/salár|holerite|folha|funcionári/.test(low)?'Salário':'Outros';
 else{const cg=[['Alimentação',['mercado','supermerc','restaur','lanche','padaria','ifood','rappi','pão','carne','feira','pizza','burguer','café','açúcar']],['Transporte',['uber','99app','posto','combust','gasolina','ônibus','onibus','metrô','metro','taxi','estacion','pedágio','ipva']],['Moradia',['aluguel','condomínio','condominio','energia','internet','iptu','imóvel','imovel']],['Lazer',['netflix','spotify','cinema','jogo','steam','bar','show','viagem','disney']],['Saúde',['farmácia','farmacia','drogaria','hospital','médic','medic','plano de saúde','academia']],['Compras',['loja','magazine','amazon','shopee','aliexpress','roupa','tênis','tenis','eletrônic','celular','mercado livre']]];
  for(const[c,ws]of cg)if(ws.some(w=>low.includes(w))){cat=c;break}}
 let name='';
 const parts=t.split(/\s+[-–—]\s+/).map(s=>s.trim()).filter(s=>s&&!/R\$|^\s*[\d.]+,\d{2}\s*$/.test(s)&&!/^(hoje|ontem)$/i.test(s));
 const bp=/^(compra|pagament|pix|saque|recebim|crédit|credit|débito|debito|boleto|fatura|transfer|estorno|aprovad|cartão|valores?|você)/i;
 const cands=parts.filter(p=>!bp.test(p)&&!/\d+[.,]\d{2}/.test(p));
 if(cands.length)name=cands[cands.length-1];
 if(!name){const x=t.match(/\b(?:em|na|no|para|de)\s+([A-ZÀ-Ú][a-zà-úA-ZÀ-Ú&']{1,34}(?:\s+[a-zà-úA-ZÀ-ú&']{1,20}){0,3})/);if(x){let n=x[1].trim().replace(/\s+(em|de|no|na|do|da|com|por|a|o)$/i,'');if(n&&!bp.test(n))name=n}}
 const ck=t.match(/final\s*(\d{4})/i);
 if(ck&&!/final/i.test(name))name=name?name+' (final '+ck[1]+')':'Cartão final '+ck[1];
 if(!name){const kw=['pix','saque','compra','boleto','fatura','ted','transferência','estorno'].find(w=>low.includes(w));name=kw?kw[0].toUpperCase()+kw.slice(1):'Notificação importada'}
 if(name.length>50)name=name.slice(0,50);
 let date=today();
 if(/\bontem\b/.test(low)){const d=new Date();d.setDate(d.getDate()-1);date=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
 else{const dm=t.match(/\b(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\b/);if(dm&&+dm[2]>=1&&+dm[2]<=12){const y=dm[3]?(dm[3].length==2?2000+ +dm[3]:+dm[3]):new Date().getFullYear();date=y+'-'+dm[2]+'-'+dm[1]}}
 return{type,name,amt:a,cat,date};
}

const upcoming=()=>S.ev.filter(e=>!e.done&&e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
function evRow(e){const p=P(e.date);
 return`<div class="r ${e.done?'dn':''}"><input type="checkbox" aria-label="Concluído" ${e.done?'checked':''} onchange="toggleEv(${e.id},this.checked)"><div class="dt"><b>${p.d}</b><span>${MN[p.m].slice(0,3)}</span></div><div class="t" onclick="evSheet(${e.id})"><div>${esc(e.title)}</div><div class="mu">${e.time||'Dia todo'}${e.note?' · '+esc(e.note):''}</div></div></div>`}

const PAL=['#22E1D0','#3F7FE8','#1E9BFF','#9A6BEA','#D56EF5','#F26BD9','#5FD0FF','#8B93B8'];
function donut(cats,o){let a=0;const st=cats.map(([c,t],k)=>{const s=a;a+=t/o*100;return`${PAL[k%8]} ${s}% ${a}%`}).join(',');
 return`<div style="display:flex;gap:16px;align-items:center"><div style="width:124px;height:124px;border-radius:50%;background:conic-gradient(${st});display:grid;place-items:center;flex:none"><div class="mu" style="width:78px;height:78px;border-radius:50%;background:var(--sf);display:grid;place-items:center;text-align:center">Saídas<br>do mês</div></div><div style="flex:1;min-width:0">${cats.map(([c,t],k)=>`<div style="display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0"><i style="width:10px;height:10px;border-radius:50%;border:2px solid ${PAL[k%8]};flex:none"></i><span style="flex:1">${c}</span><span class="mu">${Math.round(t/o*100)}%</span></div>`).join('')}</div></div>`}
function lineChart(ch,mx){
 const X=i=>20+i*52,Y=v=>120-v/mx*100,pi=ch.map((m,i)=>[X(i),Y(m.in)]),po=ch.map((m,i)=>[X(i),Y(m.out)]);
 const sp=p=>p.reduce((d,q,i)=>i?d+` C${(p[i-1][0]+q[0])/2},${p[i-1][1]} ${(p[i-1][0]+q[0])/2},${q[1]} ${q[0]},${q[1]}`:`M${q[0]},${q[1]}`,'');
 return`<svg viewBox="0 0 300 138" width="100%" role="img" aria-label="Entradas e saídas por mês"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22E1D0" stop-opacity=".35"/><stop offset="1" stop-color="#22E1D0" stop-opacity="0"/></linearGradient></defs>${[20,45,70,95,120].map(y=>`<line x1="10" x2="290" y1="${y}" y2="${y}" style="stroke:var(--ln)"/>`).join('')}<path d="${sp(pi)} L${X(5)},120 L${X(0)},120Z" fill="url(#ga)"/><path d="${sp(pi)}" fill="none" stroke="#22E1D0" stroke-width="2.5"/><path d="${sp(po)}" fill="none" stroke="#D56EF5" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>${pi.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#22E1D0"/>`).join('')}${ch.map((m,i)=>`<text x="${X(i)}" y="134" text-anchor="middle" font-size="10" style="fill:var(--mut)">${MN[m.i%12].slice(0,3)}</text>`).join('')}</svg>`}
function home(){
 const l=monthTx(),i=sum(l,'in'),o=sum(l,'out'),bal=i-o,invs=S.cards.map(c=>({c,inv:invoice(cur,c.id)})),tot=invs.reduce((s,x)=>s+x.inv.t,0),after=bal-tot;
 const by={};l.filter(x=>x.type=='out').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
 const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const up=upcoming().slice(0,3);
 return mbar()+`<h1>${l.length?(bal>=0?`Em ${MN[cur%12]}, sobraram ${BRL.format(bal)}`:`Em ${MN[cur%12]}, faltaram ${BRL.format(-bal)}`):`Nada lançado em ${MN[cur%12]} ainda`}</h1>
 <div class="two"><div class="gc" style="background:var(--g2)"><small>Entradas</small><b>${BRL.format(i)}</b></div><div class="gc" style="background:var(--g1)"><small>Saídas</small><b>${BRL.format(o)}</b></div></div>
 <div class="cd" onclick="tab='card';render()" style="cursor:pointer"><div class="mu">Total das faturas de ${MN[cur%12]} (todos os cartões)</div><b style="font-size:26px;display:block;margin:4px 0 8px">${BRL.format(tot)}</b>${invs.length?invs.map(({c,inv})=>`<div style="display:flex;justify-content:space-between;margin-top:6px"><span>${BRANDS[c.brand].n} <span class="mu">fecha ${fd(closeD(cur,c))}</span></span><b>${BRL.format(inv.t)}</b></div>`).join('')+(tot?`<div class="mu" style="margin-top:8px">Saldo depois das faturas: <b class="${after>=0?'in':'out'}">${BRL.format(after)}</b></div>`:''):'<div class="em">Adicione seus cartões na aba Cartão.</div>'}</div>
 <h3>Para onde foi o dinheiro</h3><div class="cd">${cats.length?donut(cats,o):'<div class="em">Suas saídas por categoria aparecem aqui.</div>'}</div>
 ${budHtml(by)}
 <h3>Próximos compromissos</h3><div class="cd">${up.length?up.map(evRow).join(''):'<div class="em">Nenhum compromisso à frente. Use a aba Agenda para adicionar.</div>'}</div>`;
}
function txTab(){
 const l=monthTx();
 return mbar()+`<button class="b p w" onclick="txSheet()">Novo lançamento</button><button class="b w" style="margin-top:8px" onclick="importNotif()">📲 Importar notificação de banco</button>${notifStatus()}<div class="cd" style="margin-top:12px">${l.length?l.map(x=>`<div class="r" onclick="txSheet(${x.id})"><div class="t"><div>${esc(x.name)}</div><div class="mu">${x.cat} · ${fd(new Date(x.date+'T12:00'))}</div></div><div class="v ${x.type}">${x.type=='in'?'+':'−'} ${BRL.format(x.amt)}</div></div>`).join(''):'<div class="em">Sem lançamentos neste mês. Toque em “Novo lançamento”.</div>'}</div>`;
}
function cardTab(){
 const c=cardOf(cc);if(!c)return mbar()+'<h1>Cartões</h1><div class="cd"><div class="em">Escolha entre Neon, PicPay e Mercado Pago para começar.</div></div><button class="b p w" onclick="cardSheet()">Adicionar cartão</button>';const inv=invoice(cur,c.id),run=S.buys.filter(b=>b.cid==c.id&&b.n>1&&first(b)+b.n-1>=cur).sort((a,b)=>(first(a)+a.n)-(first(b)+b.n));
 return mbar()+`<div class="cs">${S.cards.map(x=>`<button class="${x.id==c.id?'on':''}" style="background:${BRANDS[x.brand].bg};color:${BRANDS[x.brand].fg}" onclick="cc=${x.id};render()">${BRANDS[x.brand].n.split(' ')[0]}</button>`).join('')}<button onclick="cardSheet()" style="background:var(--sf);color:var(--ink);border:1px dashed var(--mut)">+ Cartão</button></div>
 <div class="cc" style="background:${BRANDS[c.brand].bg};color:${BRANDS[c.brand].fg}" onclick="cardSheet(${c.id})"><div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="bn">${BRANDS[c.brand].n}</span><span style="font-size:12px;opacity:.8">toque para editar</span></div><div class="ch"></div><div class="ft"><div>Fatura de ${MN[cur%12]}<b>${BRL.format(inv.t)}</b></div><div style="text-align:right">Fecha ${fd(closeD(cur,c))}<br>Vence ${fd(dueD(cur,c))}</div></div></div>
 ${c.limit>0?(()=>{const u=used(c),r=c.limit-u;return`<div class="cd"><div style="display:flex;justify-content:space-between"><span>Limite disponível</span><b class="${r>=0?'in':'out'}">${BRL.format(r)}</b></div><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,u/c.limit*100)}%;background:${u/c.limit>.8?'var(--ex)':'var(--ac)'}"></i></div><div class="mu">Usado ${BRL.format(u)} de ${BRL.format(c.limit)}</div></div>`})():'<div class="cd"><div class="em">Toque no cartão para definir o limite.</div></div>'}
 
 <button class="b p w" onclick="buySheet()">Nova compra no cartão</button>
 <h3>Nesta fatura</h3><div class="cd">${inv.it.length?inv.it.map(({b,k,v})=>`<div class="r" onclick="buySheet(${b.id})"><div class="t"><div>${esc(b.name)}</div><div class="mu">${b.n>1?`Parcela ${k+1} de ${b.n}`:'À vista'} · comprado em ${fd(new Date(b.date+'T12:00'))}</div></div><div class="v">${BRL.format(v)}</div></div>`).join(''):'<div class="em">Nenhuma compra nesta fatura.</div>'}</div>
 <h3>Parcelamentos em andamento</h3><div class="cd">${run.length?run.map(b=>{const l=first(b)+b.n-1;return`<div class="r" onclick="buySheet(${b.id})"><div class="t"><div>${esc(b.name)} · ${b.n}x de ${BRL.format(part(b,0))}</div><div class="mu">Última parcela na fatura de ${MN[l%12]}/${Math.floor(l/12)}, que fecha em ${fd(closeD(l,c),1)}</div></div></div>`}).join(''):'<div class="em">Nenhuma compra parcelada em andamento.</div>'}</div>`;
}
function agenda(){
 const up=upcoming(),rest=S.ev.filter(e=>!up.includes(e)).sort((a,b)=>b.date.localeCompare(a.date));
 return`<h1>Agenda</h1><button class="b p w" onclick="evSheet()">Novo compromisso</button><h3>Próximos</h3><div class="cd">${up.length?up.map(evRow).join(''):'<div class="em">Nenhum compromisso marcado.</div>'}</div>${rest.length?`<h3>Concluídos e passados</h3><div class="cd">${rest.map(evRow).join('')}</div>`:''}`;
}
function hist(){
 const n=now.getFullYear()*12+now.getMonth(),all=[];
 for(let i=n;i>n-12;i--){const l=S.tx.filter(x=>ix(x.date)==i),f=S.cards.reduce((s,c)=>s+invoice(i,c.id).t,0);all.push({i,in:sum(l,'in'),out:sum(l,'out'),f,has:l.length>0||f>0})}
 const ch=all.slice(0,6).reverse(),mx=Math.max(1,...ch.map(m=>Math.max(m.in,m.out))),rows=all.filter(m=>m.has);
 return`<h1>Histórico</h1><div class="cd"><div class="mu" style="margin-bottom:10px"><b class="in">■ Entradas</b> &nbsp; <b class="out">■ Saídas</b> · últimos 6 meses</div>${lineChart(ch,mx)}</div>
 <h3>Mês a mês</h3><div class="cd">${rows.length?rows.map(m=>{const b=m.in-m.out;return`<div class="r" onclick="cur=${m.i};tab='tx';render()"><div class="t"><div style="text-transform:capitalize">${mlabel(m.i)}</div><div class="mu">Entrou ${BRL.format(m.in)} · Saiu ${BRL.format(m.out)}${m.f?' · Fatura '+BRL.format(m.f):''}</div></div><div class="v ${b>=0?'in':'out'}">${BRL.format(b)}</div></div>`}).join(''):'<div class="em">Quando você registrar lançamentos, o histórico de cada mês aparece aqui.</div>'}</div>
 
 <h3>Configurações & Backup</h3>
 <div class="cd">
  <button class="b w" onclick="exportBackup()" style="margin-bottom:10px">📥 Fazer Backup dos Dados (JSON)</button>
  <button class="b w" onclick="importBackup()" style="margin-bottom:10px">📂 Restaurar Backup</button>
  <button class="b w" onclick="budSheet()" style="margin-bottom:10px">🎯 Orçamento por categoria</button>
  <button class="b w" onclick="histVerSheet()" style="margin-bottom:10px">🕘 Histórico de versões (desfazer)</button>
  <button class="b w" onclick="lockSheet()" style="margin-bottom:10px">${lockCfg()?'🔓 Bloqueio por PIN (ativo)':'🔒 Ativar bloqueio por PIN'}</button>
  <div class="mu">Baixe um arquivo com todos os seus lançamentos, cartões e compromissos para garantir a segurança das suas informações.</div>
 </div>
 ${syncHtml()}`;
}
function render(){
 $('#app').innerHTML={home,tx:txTab,hist,card:cardTab,ag:agenda}[tab]();
 $('#nav').innerHTML=[['home','Resumo'],['tx','Lançamentos'],['hist','Histórico'],['card','Cartão'],['ag','Agenda']].map(([k,t])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${t}</button>`).join('');
}
render();
// Captura automática: verifica notificações pendentes periodicamente
setInterval(pullNotifs,5000);
setTimeout(pullNotifs,2500);
function onBack(){if(window.AndroidBridge){pullNotifs();if($('#ov').hidden)render()}autoSync()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)onBack();else{autoSync();if(lockCfg())lockShow()}});
window.addEventListener('focus',onBack);
// PWA: manifest + service worker só no web de verdade (fora do app Android e fora de file://)
if(location.protocol.startsWith('http') && !window.Capacitor && !window.cordova){
  const lm=document.createElement('link');lm.rel='manifest';lm.href='manifest.webmanifest';document.head.appendChild(lm);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// Sincronização: atualiza a nuvem imediatamente ao abrir o app (se conectado)
if(syncCfg())autoSync();
// Bloqueio por PIN: pede o PIN logo na abertura (se ativado neste aparelho)
if(lockCfg())lockShow();
</script>
</body>
</html>
