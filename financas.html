/* --- Temas (3 em ciclo por 1 botão nas Configurações). Padrão: Cristal claro, paleta inspirada no GTA VI (sem marcas) --- */
:root{--bg:#F8F3FC;--sf:rgba(255,255,255,.72);--card-bg:rgba(255,255,255,.74);--ink:#221033;--mut:#7C6B90;--ac:#F0247E;--ok:#0E9E90;--on:#3B0A1E;--ex:#E01B72;--ln:rgba(30,10,50,.10);--tint:rgba(30,10,50,.05);
--g1:linear-gradient(135deg,#FF2E8B,#FF7A2F);--g2:linear-gradient(135deg,#2ED3C6,#4C7DFF);--gp:linear-gradient(135deg,#F0247E,#FF7A2F 62%,#E39A00);
--gl1:rgba(255,46,139,.16);--gl2:rgba(255,122,47,.16);--gl3:rgba(139,92,246,.10);
--navbg:rgba(255,255,255,.82);--shbg:rgba(255,255,255,.94);--ovbg:rgba(248,243,252,.72);--inputbg:rgba(255,255,255,.92);
--hi:rgba(255,255,255,.95);--shcol:rgba(70,30,90,.13);--insetc:rgba(60,30,80,.08);--glowc:rgba(240,36,126,.26);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html[data-theme=gta-escuro]{--bg:#1B0B30;--sf:rgba(255,255,255,.10);--card-bg:rgba(255,255,255,.075);--ink:#FFF7FC;--mut:rgba(255,240,250,.62);--ac:#FF4D9E;--ok:#2ED3C6;--ex:#FF6E9F;--ln:rgba(255,255,255,.14);--tint:rgba(255,255,255,.09);
--gp:linear-gradient(135deg,#FF4D9E,#FF7A2F 62%,#FFC33A);--gl1:rgba(255,46,139,.42);--gl2:rgba(255,122,47,.34);--gl3:rgba(139,92,246,.20);
--navbg:rgba(28,14,46,.85);--shbg:rgba(38,22,60,.94);--ovbg:rgba(12,6,22,.70);--inputbg:rgba(10,8,24,.70);
--hi:rgba(255,255,255,.10);--shcol:rgba(0,0,0,.40);--insetc:rgba(0,0,0,.40);--glowc:rgba(255,77,158,.30);color-scheme:dark}
html[data-theme=gta-sunset]{--bg:#22081C;--sf:rgba(255,255,255,.10);--card-bg:rgba(255,246,242,.08);--ink:#FFF6EF;--mut:rgba(255,238,228,.62);--ac:#FF7A2F;--ok:#2ED3C6;--ex:#FF3D8B;--ln:rgba(255,255,255,.14);--tint:rgba(255,255,255,.09);

html{background:var(--bg)}


*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 3%,var(--gl1),transparent 46%),radial-gradient(circle at 92% 97%,var(--gl2),transparent 48%),radial-gradient(circle at 70% 60%,var(--gl3),transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.mb{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mb b{font-size:18px;font-weight:600;letter-spacing:-.01em}
.ib{border:1px solid var(--ln);background:var(--sf);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 4px 16px var(--shcol);display:grid;place-items:center;padding:0}
h1{font-size:26px;line-height:1.2;font-weight:700;margin:6px 0 14px;letter-spacing:-.02em;background:var(--gp);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h3{font-size:15px;font-weight:600;margin:22px 0 8px;letter-spacing:-.01em}
.cd{background:var(--card-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--ln);box-shadow:0 12px 40px var(--shcol), inset 0 1px 0 var(--hi);border-radius:24px;padding:18px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.gc{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:0 12px 40px var(--shcol), inset 0 1px 0 rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.1)}
.gc:after{content:"";position:absolute;right:-22px;bottom:-34px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,0.15)}
.gc small{font-size:14px;opacity:.9}.gc b{display:block;font-size:22px;margin-top:6px;font-weight:700}
.mu{color:var(--mut);font-size:13px}
.in{color:var(--ok)}.out{color:var(--ex)}
.r{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.r:last-child{border-bottom:0}
.r .t{flex:1;min-width:0}.r .t div:first-child{font-weight:500;overflow-wrap:anywhere}
.r .v{font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--tint);overflow:hidden;margin-top:4px;box-shadow:inset 0 1px 2px var(--shcol)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.b{border:1px solid var(--ln);background:var(--sf);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 6px 20px var(--shcol)}
.b.p{background:var(--gp);color:var(--on);border-color:transparent;box-shadow:0 8px 24px var(--glowc)}
.b.d{color:var(--ex);margin-right:auto}
.b.w{width:100%}
.b.icn{display:flex;align-items:center;justify-content:center;gap:8px}
svg.ic{vertical-align:-4px;margin-right:7px}
.b.icn svg.ic{margin-right:0}
nav svg.ic{display:block;margin:0}
.em{color:var(--mut);padding:10px 0;font-size:14px}
.dt{width:48px;text-align:center;border-radius:12px;background:var(--tint);border:1px solid var(--ln);padding:5px 0;line-height:1.1;flex:none}
.dt b{display:block;font-size:20px}.dt span{font-size:12px;color:var(--mut)}
.dn{opacity:.5}.dn .t div:first-child{text-decoration:line-through}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--navbg);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:9px 0 8px;cursor:pointer;border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:-.01em}
nav button .lbl{line-height:1.1}
nav button.on{color:var(--ac);border-top-color:transparent;font-weight:600}
nav button.on:before{content:"";position:absolute;top:-3px;left:16%;right:16%;height:3px;border-radius:0 0 4px 4px;background:var(--gp)}
nav button.on .lbl{background:var(--gp);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.ov{position:fixed;inset:0;background:var(--ovbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden]{display:none}
.sh{background:var(--shbg);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-top:1px solid var(--ln);box-shadow:0 -15px 50px var(--shcol);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:32px 32px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--inputbg);border:1px solid var(--ln);border-radius:14px;padding:12px;box-shadow:inset 0 2px 4px var(--insetc)}
.ac{display:flex;gap:8px;margin-top:16px}
#er{color:var(--ex);font-size:14px;min-height:20px;margin-top:8px}
#pv{font-size:14px;background:var(--tint);border-radius:14px;padding:10px;margin-top:10px}
.cc{aspect-ratio:1.586;border-radius:24px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 40px var(--shcol), inset 0 1px 0 rgba(255,255,255,0.2);margin-bottom:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.12)}
.cc .bn{font-weight:700;font-size:22px;letter-spacing:-.01em}
.cc .ch{width:40px;height:30px;border-radius:8px;background:linear-gradient(135deg,#f3d98b,#c49a3a)}
.cc .ft{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px}
.cc .ft b{font-size:20px;display:block}
.cs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px}
.cs button{flex:none;border:2px solid transparent;border-radius:14px;width:84px;height:44px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;background:var(--sf);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.cs button.on{border-color:var(--ac);box-shadow:0 0 15px var(--glowc)}
.pk{display:flex;gap:8px}
.pk button{flex:1;aspect-ratio:1.586;border-radius:14px;border:3px solid transparent;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.pk button.on{border-color:var(--ac);box-shadow:0 0 15px var(--glowc)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* --- Rosquinha minimalista: anel fino, pontas arredondadas, traço que se desenha --- */
@keyframes dsegIn{from{stroke-dasharray:0 var(--c)}to{stroke-dasharray:var(--l) var(--c)}}
@keyframes dsegFade{from{opacity:0}to{opacity:1}}
@keyframes dctrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dlIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.drow{display:flex;gap:22px;align-items:center}
.dwrap{position:relative;width:152px;height:152px;flex:none}
.dsvg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 16px var(--glowc))}
.dctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;animation:dctrIn .7s cubic-bezier(.22,1,.36,1) .45s both}
.dctr span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.dctr b{display:block;font-size:17px;font-weight:650;letter-spacing:-.02em;margin-top:3px}
.dlegend{flex:1;min-width:0}
.dl{display:flex;align-items:center;gap:9px;font-size:14px;margin:7px 0;animation:dlIn .5s cubic-bezier(.22,1,.36,1) both}
.dl i{width:9px;height:9px;border-radius:50%;flex:none;opacity:.92}
.dl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl b{color:var(--mut);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.dseg{animation:dsegIn .9s cubic-bezier(.22,1,.36,1) both,dsegFade .3s ease-out both;animation-delay:var(--d),var(--d)}
@media (prefers-reduced-motion:reduce){.dseg,.dctr,.dl{animation:none}}
</style>
</head>

// --- RESTAURAR BACKUP (valida e aplica; retorna '' em sucesso) ---
function applyBackup(d){
  if(!d||typeof d!=='object'||Array.isArray(d)||!Array.isArray(d.tx))
    return'Arquivo inválido: não parece um backup do Minhas Finanças.';
  S=Object.assign({tx:[],buys:[],cards:[],ev:[],bud:{}},d);
  if(!Array.isArray(S.cards))S.cards=[];
  if(!Array.isArray(S.buys))S.buys=[];
  if(!Array.isArray(S.ev))S.ev=[];
  if(!S.bud||typeof S.bud!=='object')S.bud={};
  save();render();
  return'';
}
function importBackup(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d=null;try{d=JSON.parse(rd.result)}catch(e){}
      const err=applyBackup(d);
      if(err)alert(err);
      else alert('Backup restaurado com sucesso! '+S.tx.length+' lançamento(s).');
    };
    rd.readAsText(f);
  };
  inp.click();
}

const SKEY='fin_sync',GF='minhas-financas.json',GD='Minhas Finanças backup';

async function ghApi(method,path,body){
 const c=syncCfg();
 const r=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body==null?undefined:JSON.stringify(body)});
 if(r.status===204)return null;
 if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
 return r.json();
}
let cloudHist=[]; // versões anteriores guardadas na nuvem (desfazer)
function pushHist(data,t){
 if(!data||!Array.isArray(data.tx))return;
 if(cloudHist.length&&JSON.stringify(cloudHist[0].data)===JSON.stringify(data))return; // evita duplicata
 cloudHist.unshift({t:t||Date.now(),data:data});
 cloudHist=cloudHist.slice(0,15); // mantém as 15 versões mais recentes
}
function cloudPayload(){return JSON.stringify({v:2,upd:S.upd||Date.now(),data:S,hist:cloudHist})}
function applyRemote(p){
 // Guarda a versão local que será substituída (desfazer)
 if(S&&Array.isArray(S.tx)&&S.tx.length&&p&&p.data&&JSON.stringify(p.data)!==JSON.stringify(S))
  pushHist(JSON.parse(JSON.stringify(S)),S.upd);
 try{localStorage.setItem('fin_local_backup',JSON.stringify(S))}catch(e){}
 S=Object.assign({tx:[],buys:[],cards:[],ev:[],bud:{}},p.data||{});
 if(!S.bud||typeof S.bud!=='object')S.bud={};
 S.upd=p.upd||0;
 try{localStorage.setItem('fin1',JSON.stringify(S))}catch(e){}
 const cur=S.upd;S.upd=0;lastBody=JSON.stringify(S);S.upd=cur;
}
async function pushLocal(prevP){
 // Guarda a versão que está sendo substituída na nuvem (desfazer)
 if(prevP&&prevP.data&&Array.isArray(prevP.data.tx)&&JSON.stringify(prevP.data)!==JSON.stringify(S))
  pushHist(prevP.data,prevP.upd);
 const c=syncCfg();
 await ghApi('PATCH','/gists/'+c.gistId,{files:{[GF]:{content:cloudPayload()}}});
 c.lastSync=Date.now();setSyncCfg(c);
}
async function syncConnect(tok){
 tok=String(tok||'').trim();
 if(!tok)return'Cole o token de acesso.';
 if(driveCfg()){
  if(!confirm('A sincronização do Google Drive está ativa.\n\nOK = trocar para GitHub (o Drive é desligado)\nCancelar = manter o Drive'))return'Sincronização já ativa no Google Drive.';
  setDriveCfg(null);dTok=null;dExp=0;
 }
 if(jsCfg()){
  if(!confirm('A Nuvem está ativa.\n\nOK = trocar para GitHub (a Nuvem é desligada)\nCancelar = manter a Nuvem'))return'Sincronização já ativa na Nuvem.';
  setJsCfg(null);
 }
 const prev=syncCfg();
 setSyncCfg({token:tok,gistId:prev&&prev.gistId?prev.gistId:null,lastSync:0});
 try{await ghApi('GET','/user')}
 catch(e){setSyncCfg(prev||null);return e.status===401?'Token inválido ou expirado.':'Não consegui validar o token ('+e.message+').'}
 try{
  const list=await ghApi('GET','/gists?per_page=100');
  const found=(list||[]).find(g=>g.files&&g.files[GF]);
  if(found){
   setSyncCfg({token:tok,gistId:found.id,lastSync:0});
   const g=await ghApi('GET','/gists/'+found.id);
   let p=null;try{p=JSON.parse(g.files[GF].content)}catch(e){}
   if(p&&Array.isArray(p.hist))cloudHist=p.hist;
   if(p&&p.data&&Array.isArray(p.data.tx)&&p.data.tx.length){
    if(!(S.tx&&S.tx.length))applyRemote(p);
    else{
     const useLocal=confirm('Encontrei dados na nuvem E neste aparelho.\n\nOK = enviar a versão DESTE aparelho (substitui a nuvem)\nCancelar = baixar a versão da nuvem');
     if(useLocal)await pushLocal(p);else applyRemote(p);
    }
   }else await pushLocal();
   setSyncCfg(Object.assign(syncCfg(),{lastSync:Date.now()}));
   return'';
  }
  const g=await ghApi('POST','/gists',{description:GD,public:false,files:{[GF]:{content:cloudPayload()}}});
  setSyncCfg({token:tok,gistId:g.id,lastSync:Date.now()});
  return'';
 }catch(e){setSyncCfg(prev||null);return'Erro ao conectar: '+e.message}
}
async function syncNow(){
 const c=syncCfg();
 if(!c||!c.gistId||syncBusy)return null;
 syncBusy=true;
 try{
  const g=await ghApi('GET','/gists/'+c.gistId);
  const f=g.files[GF];
  let p=null;if(f){try{p=JSON.parse(f.content)}catch(e){}}
  if(p&&Array.isArray(p.hist))cloudHist=p.hist;
  const lu=S.upd||0,ru=p&&p.upd?p.upd:0;
  if(!p||!p.data||!Array.isArray(p.data.tx)){await pushLocal();return'enviado'}
  if(ru===lu){setSyncCfg(Object.assign(c,{lastSync:Date.now()}));return'em dia'}
  if(ru<lu){await pushLocal(p);return'enviado'}
  if(lu>c.lastSync){
   const useLocal=confirm('Os dados mudaram nos dois aparelhos desde a última sincronização.\n\nOK = enviar a versão DESTE aparelho\nCancelar = baixar a versão da nuvem');
   if(useLocal){await pushLocal(p);return'conflito-enviado'}
   applyRemote(p);setSyncCfg(Object.assign(syncCfg(),{lastSync:Date.now()}));return'conflito-nuvem';
  }
  applyRemote(p);setSyncCfg(Object.assign(syncCfg(),{lastSync:Date.now()}));return'atualizado';
 }catch(e){return'erro: '+e.message}
 finally{syncBusy=false}
}

function ensureGis(){
 if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return Promise.resolve();

let dTok=null,dExp=0;
function driveToken(force){
 if(dTok&&Date.now()<dExp-9e5&&!force)return Promise.resolve(dTok);
 return ensureGis().then(()=>new Promise(res=>{
  let done=false;
  const ok=v=>{if(done)return;done=true;if(v&&v.access_token){dTok=v.access_token;dExp=Date.now()+(+v.expires_in||3600)*1000;res(dTok)}else{dTok=null;res(null)}};
  try{
   const tc=window.google.accounts.oauth2.initTokenClient({client_id:(driveCfg()||{}).clientId||'',scope:DSCOPE,
    callback:ok,error_callback:()=>{if(done)return;done=true;dTok=null;res(null)}});
   tc.requestAccessToken({prompt:force?'consent':''});
  }catch(e){res(null)}
  setTimeout(()=>{if(!done){done=true;res(dTok||null)}},20000);
 })).catch(()=>null);
}
async function dReq(url,opt){
 const t=await driveToken(false);
 if(!t){const e=new Error('sessão do Google expirada — toque em “Entrar com Google”.');e.status=401;throw e}
 const h={'Authorization':'Bearer '+t};
 if(opt&&opt.ctype)h['Content-Type']=opt.ctype;
 const r=await fetch(url,{method:(opt&&opt.method)||'GET',headers:h,body:opt&&opt.body!=null?opt.body:undefined});
 if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
 return r.status===204?null:r;
}

const JKEY='fin_js',JLAST='fin_js_last',JNAME='minhas_financas_backup';
function jsCfg(){try{return JSON.parse(localStorage.getItem(JKEY))}catch(e){return null}}
function setJsCfg(c){try{c?localStorage.setItem(JKEY,JSON.stringify(c)):localStorage.removeItem(JKEY)}catch(e){}}
function jsLast(){try{return JSON.parse(localStorage.getItem(JLAST))}catch(e){return null}}
function setJsLast(c){try{c?localStorage.setItem(JLAST,JSON.stringify(c)):localStorage.removeItem(JLAST)}catch(e){}}
function jsRemember(){const c=jsCfg();if(c&&c.itemId)setJsLast({key:c.key,userId:c.userId,itemId:c.itemId})}
function jsCode(c){try{return'JSC1:'+btoa(unescape(encodeURIComponent(JSON.stringify({k:c.key,u:c.userId,i:c.itemId}))))}catch(e){return''}}
function jsParseCode(s){try{const j=JSON.parse(decodeURIComponent(escape(atob(String(s).trim().slice(5)))));return j&&j.k&&j.u&&j.i?j:null}catch(e){return null}}
async function jsReq(method,path,body){
 const c=jsCfg();
 if(!c||!c.key){const e=new Error('nuvem não conectada');e.status=0;throw e}
 const opt={method:method};
 if(method==='POST'||method==='PUT'){opt.headers={'Content-Type':'application/json'};opt.body=body==null?undefined:body}
 const url='https://api.jsonstorage.net'+path+(path.indexOf('?')<0?'?':'&')+'apiKey='+encodeURIComponent(c.key);
 const r=await fetch(url,opt);
 if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
 return r.status===204?null:r.json();
}
async function jsCreateItem(){
 const j=await jsReq('POST','/v1/json?name='+encodeURIComponent(JNAME),cloudPayload());

 if(!iid||!uid)throw new Error('resposta inesperada do servidor');

 }catch(e){return null}

async function jsPush(prevP){
 if(prevP&&prevP.data&&Array.isArray(prevP.data.tx)&&JSON.stringify(prevP.data)!==JSON.stringify(S))

async function jsSyncNow(){
 const c=jsCfg();
 if(!c||!c.itemId||syncBusy)return null;
 syncBusy=true;
 try{
  let p=null;
  try{p=await jsReq('GET','/v1/json/'+c.userId+'/'+c.itemId)}
  catch(e){
   if(e.status===404){await jsCreateItem();return'enviado'} // item apagado na nuvem → recria
   throw e;
  }
  if(p&&p.json&&typeof p.json==='object'&&!p.data)p=p.json; // resposta embrulhada
  if(p&&Array.isArray(p.hist))cloudHist=p.hist;
  const lu=S.upd||0,ru=p&&p.upd?p.upd:0;
  if(!p||!p.data||!Array.isArray(p.data.tx)){await jsPush();return'enviado'}
  if(ru===lu){setJsCfg(Object.assign(jsCfg(),{lastSync:Date.now()}));return'em dia'}
  if(ru<lu){await jsPush(p);return'enviado'}
  if(lu>(c.lastSync||0)){
   const useLocal=confirm('Os dados mudaram nos dois aparelhos desde a última sincronização.\n\nOK = enviar a versão DESTE aparelho\nCancelar = baixar a versão da nuvem');
   if(useLocal){await jsPush(p);return'conflito-enviado'}
   applyRemote(p);setJsCfg(Object.assign(jsCfg(),{lastSync:Date.now()}));return'conflito-nuvem';
  }
  applyRemote(p);setJsCfg(Object.assign(jsCfg(),{lastSync:Date.now()}));return'atualizado';
 }catch(e){return'erro: '+e.message}
 finally{syncBusy=false}
}
async function jsConnect(raw){
 raw=String(raw||'').trim();
 if(!raw)return'Cole a chave da sua nuvem (ou o link de sincronização).';
 const isCode=raw.indexOf('JSC1:')===0;
 const tgt=isCode?jsParseCode(raw):null;
 if(isCode&&!tgt)return'Link de sincronização inválido.';
 const tgtKey=tgt?tgt.k:raw;
 const cur=jsCfg();
 if(cur&&tgtKey&&tgtKey!==cur.key){
  if(!confirm('Já existe uma nuvem conectada.\n\nOK = trocar para a nova nuvem\nCancelar = manter a atual'))return'Sincronização já ativa na Nuvem.';
 }
 let backSync=null,backDrive=null;
 if(syncCfg()||driveCfg()){
  const quem=driveCfg()?'Google Drive':'GitHub';
  if(!confirm('A sincronização do '+quem+' está ativa.\n\nOK = trocar para a Nuvem (o '+quem+' é desligado)\nCancelar = manter o '+quem))return'Sincronização já ativa no '+quem+'.';
  backSync=syncCfg();backDrive=driveCfg();
  setSyncCfg(null);setDriveCfg(null);dTok=null;dExp=0;
 }
 const prev=cur;
 const fail=msg=>{if(backSync)setSyncCfg(backSync);if(backDrive)setDriveCfg(backDrive);setJsCfg(prev||null);return msg};
 if(tgt){
  setJsCfg({key:tgt.k,userId:tgt.u,itemId:tgt.i,lastSync:0});
  jsRemember();
  const r=await jsSyncNow();
  if(r&&r.startsWith('erro'))return fail('Não consegui baixar da nuvem ('+r.slice(6)+'). Confira a internet e tente de novo.');
  return'';
 }
 // chave: se já usamos esta chave antes, reutiliza o mesmo item (não duplica)
 const last=jsLast();
 if(last&&last.key===raw&&last.itemId){
  setJsCfg({key:raw,userId:last.userId,itemId:last.itemId,lastSync:0});
  const r=await jsSyncNow();
  if(!r||!r.startsWith('erro')){jsRemember();return''}
  const st=parseInt(String(r).replace(/[^0-9]/g,''),10);
  if(!st||st>=500)return fail('Não consegui conectar ('+r.slice(6)+'). Confira sua internet.');
  setJsCfg({key:raw,userId:null,itemId:null,lastSync:0});
 }
 // tenta achar a nuvem do próprio dono da chave (evita item duplicado)
 if(!(jsCfg()&&jsCfg().userId)){
  const iid=await jsFindByUid(raw);
  if(iid){
   setJsCfg({key:raw,userId:raw,itemId:iid,lastSync:0});
   const r=await jsSyncNow();
   if(!r||!r.startsWith('erro')){jsRemember();return''}
  }
  setJsCfg({key:raw,userId:null,itemId:null,lastSync:0});
 }
 try{await jsCreateItem()}
 catch(e){
  if(e.status===400||e.status===401||e.status===403)return fail('A chave não foi aceita. Copie a chave novamente no painel (ícone da chave) e tente de novo.');
  return fail('Não consegui criar a nuvem ('+e.message+'). Confira sua internet.');
 }
 return'';
}

async function hashPin(p){
 const s='MFpin:'+p;
 try{
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
   const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
   return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
 }catch(e){}
 // fallback determinístico (ambientes sem crypto.subtle)
 let h1=0x811c9dc5>>>0,h2=0x1b873593>>>0;
 for(let i=0;i<s.length;i++){h1=((h1^s.charCodeAt(i))*16777619)>>>0;h2=(h2+s.charCodeAt(i)*(i+7))>>>0}
 return 'f'+h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0');
}

function parseNotif(txt){
 const t=String(txt||'').trim();if(!t)return null;
 const m=t.match(/R\$\s*([\d.]+,\d{2})/i)||t.match(/R\$\s*([\d.]+)/i)||t.match(/(?:^|\s)([\d.]+,\d{2})(?=\s|$)/);
 if(!m)return null;
 const a=num(m[1]);if(!(a>0))return null;
 const low=t.toLowerCase();
 const inn=['receb','credit','depos','estorn','devolv','entrada','salár','holerite'];
 const outw=['compra','pagament','pagou','débito','debito','saque','transfer','enviad','boleto','fatura','ted','assinatura','aprovad'];
 let type;
 if(inn.some(w=>low.includes(w)))type='in';
 else if(outw.some(w=>low.includes(w)))type='out';
 else if(low.includes('pix'))type=/enviad|para |realizada para|saiu/.test(low)?'out':'in';
 else type='out';
 let cat='Outros';
 if(type=='in')cat=/salár|holerite|folha|funcionári/.test(low)?'Salário':'Outros';
 else{const cg=[['Alimentação',['mercado','supermerc','restaur','lanche','padaria','ifood','rappi','pão','carne','feira','pizza','burguer','café','açúcar']],['Transporte',['uber','99app','posto','combust','gasolina','ônibus','onibus','metrô','metro','taxi','estacion','pedágio','ipva']],['Moradia',['aluguel','condomínio','condominio','energia','internet','iptu','imóvel','imovel']],['Lazer',['netflix','spotify','cinema','jogo','steam','bar','show','viagem','disney']],['Saúde',['farmácia','farmacia','drogaria','hospital','médic','medic','plano de saúde','academia']],['Compras',['loja','magazine','amazon','shopee','aliexpress','roupa','tênis','tenis','eletrônic','celular','mercado livre']]];
  for(const[c,ws]of cg)if(ws.some(w=>low.includes(w))){cat=c;break}}
 if(type=='out'&&/fatura/.test(low)&&/pag|liquid|quit/.test(low))cat='Cartão';
 let name='';
 const parts=t.split(/\s+[-–—]\s+/).map(s=>s.trim()).filter(s=>s&&!/R\$|^\s*[\d.]+,\d{2}\s*$/.test(s)&&!/^(hoje|ontem)$/i.test(s));
 const bp=/^(compra|pagament|pix|saque|recebim|crédit|credit|débito|debito|boleto|fatura|transfer|estorno|aprovad|cartão|valores?|você)/i;
 const cands=parts.filter(p=>!bp.test(p)&&!/\d+[.,]\d{2}/.test(p));
 if(cands.length)name=cands[cands.length-1];
 if(!name){const x=t.match(/\b(?:em|na|no|para|de)\s+([A-ZÀ-Ú][a-zà-úA-ZÀ-Ú&']{1,34}(?:\s+[a-zà-úA-ZÀ-ú&']{1,20}){0,3})/);if(x){let n=x[1].trim().replace(/\s+(em|de|no|na|do|da|com|por|a|o)$/i,'');if(n&&!bp.test(n))name=n}}
 const ck=t.match(/final\s*(\d{4})/i);
 if(ck&&!/final/i.test(name))name=name?name+' (final '+ck[1]+')':'Cartão final '+ck[1];
 if(!name){const kw=['pix','saque','compra','boleto','fatura','ted','transferência','estorno'].find(w=>low.includes(w));name=kw?kw[0].toUpperCase()+kw.slice(1):'Notificação importada'}
 if(name.length>50)name=name.slice(0,50);
 let date=today();
 if(/\bontem\b/.test(low)){const d=new Date();d.setDate(d.getDate()-1);date=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
 else{const dm=t.match(/\b(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\b/);if(dm&&+dm[2]>=1&&+dm[2]<=12){const y=dm[3]?(dm[3].length==2?2000+ +dm[3]:+dm[3]):new Date().getFullYear();date=y+'-'+dm[2]+'-'+dm[1]}}
 return{type,name,amt:a,cat,date};
}

function donut(cats,o){
 const R=56,SW=10,C=2*Math.PI*R,GAP=7;
 let acc=0;
 const segs=cats.map(([c,t],k)=>{
  const len=t/o*C,s=acc;acc+=len;
  let L=Math.max(4,len-GAP);
  if(s+L>C)L=Math.max(4,C-s);
  return`<circle class="dseg" cx="70" cy="70" r="${R}" fill="none" stroke="${PAL[k%8]}" stroke-width="${SW}" stroke-linecap="round" stroke-dasharray="${L.toFixed(2)} ${(C-L).toFixed(2)}" stroke-dashoffset="${(-(s+GAP/2)).toFixed(2)}" style="--l:${L.toFixed(2)};--c:${C.toFixed(2)};--d:${(k*0.08).toFixed(2)}s"></circle>`;
 }).join('');
 return`<div class="drow"><div class="dwrap">
  <svg class="dsvg" viewBox="0 0 140 140" role="img" aria-label="Saídas por categoria">
   <circle cx="70" cy="70" r="${R}" fill="none" style="stroke:var(--tint)" stroke-width="${SW}"></circle>
   <g transform="rotate(-90 70 70)">${segs}</g>
  </svg>
  <div class="dctr"><span>Saídas</span><b>${BRL.format(o)}</b></div>
 </div><div class="dlegend">${cats.map(([c,t],k)=>`<div class="dl" style="animation-delay:${(0.35+k*0.06).toFixed(2)}s"><i style="background:${PAL[k%8]}"></i><span>${c}</span><b>${Math.round(t/o*100)}%</b></div>`).join('')}</div></div>`}
function lineChart(ch,mx){
 const X=i=>20+i*52,Y=v=>120-v/mx*100,pi=ch.map((m,i)=>[X(i),Y(m.in)]),po=ch.map((m,i)=>[X(i),Y(m.out)]);
 const sp=p=>p.reduce((d,q,i)=>i?d+` C${(p[i-1][0]+q[0])/2},${p[i-1][1]} ${(p[i-1][0]+q[0])/2},${q[1]} ${q[0]},${q[1]}`:`M${q[0]},${q[1]}`,'');
 return`<svg viewBox="0 0 300 138" width="100%" role="img" aria-label="Entradas e saídas por mês"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ok);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ok);stop-opacity:0"/></linearGradient></defs>${[20,45,70,95,120].map(y=>`<line x1="10" x2="290" y1="${y}" y2="${y}" style="stroke:var(--ln)"/>`).join('')}<path d="${sp(pi)} L${X(5)},120 L${X(0)},120Z" fill="url(#ga)"/><path d="${sp(pi)}" fill="none" style="stroke:var(--ok)" stroke-width="2.5"/><path d="${sp(po)}" fill="none" style="stroke:var(--ex)" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>${pi.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" style="fill:var(--ok)"/>`).join('')}${ch.map((m,i)=>`<text x="${X(i)}" y="134" text-anchor="middle" font-size="10" style="fill:var(--mut)">${MN[m.i%12].slice(0,3)}</text>`).join('')}</svg>`}
function home(){
 const l=monthTx(),i=sum(l,'in'),o=sum(l,'out'),bal=i-o,invs=S.cards.map(c=>({c,inv:invoice(cur,c.id)})),tot=invs.reduce((s,x)=>s+x.inv.t,0),after=bal-tot;
 const by={};l.filter(x=>x.type=='out').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
 const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const up=upcoming().slice(0,3);
 return mbar()+`<h1>${l.length?(bal>=0?`Em ${MN[cur%12]}, sobraram ${BRL.format(bal)}`:`Em ${MN[cur%12]}, faltaram ${BRL.format(-bal)}`):`Nada lançado em ${MN[cur%12]} ainda`}</h1>
 <div class="two"><div class="gc" style="background:var(--g2)"><small>Entradas</small><b>${BRL.format(i)}</b></div><div class="gc" style="background:var(--g1)"><small>Saídas</small><b>${BRL.format(o)}</b></div></div>
 <div class="cd" onclick="tab='card';render()" style="cursor:pointer"><div class="mu">Total das faturas de ${MN[cur%12]} (todos os cartões)</div><b style="font-size:26px;display:block;margin:4px 0 8px">${BRL.format(tot)}</b>${invs.length?invs.map(({c,inv})=>`<div style="display:flex;justify-content:space-between;margin-top:6px"><span>${BRANDS[c.brand].n} <span class="mu">fecha ${fd(closeD(cur,c))}</span></span><b>${BRL.format(inv.t)}</b></div>`).join('')+(tot?`<div class="mu" style="margin-top:8px">Saldo depois das faturas: <b class="${after>=0?'in':'out'}">${BRL.format(after)}</b></div>`:''):'<div class="em">Adicione seus cartões na aba Cartão.</div>'}</div>
 <h3>Para onde foi o dinheiro</h3><div class="cd">${cats.length?donut(cats,o):'<div class="em">Suas saídas por categoria aparecem aqui.</div>'}</div>
 ${budHtml(by)}
 <h3>Próximos compromissos</h3><div class="cd">${up.length?up.map(evRow).join(''):'<div class="em">Nenhum compromisso à frente. Use a aba Agenda para adicionar.</div>'}</div>`;
}
function txTab(){
 const l=monthTx();
 return mbar()+`<button class="b p w" onclick="txSheet()">${ico('add-outline',18)} Novo lançamento</button><button class="b w" style="margin-top:8px" onclick="importNotif()">${ico('notifications-outline',18)} Importar notificação de banco</button>${notifStatus()}<div class="cd" style="margin-top:12px">${l.length?l.map(x=>`<div class="r" onclick="txSheet(${x.id})"><div class="t"><div>${esc(x.name)}</div><div class="mu">${x.cat} · ${fd(new Date(x.date+'T12:00'))}</div></div><div class="v ${x.type}">${x.type=='in'?'+':'−'} ${BRL.format(x.amt)}</div></div>`).join(''):'<div class="em">Sem lançamentos neste mês. Toque em “Novo lançamento”.</div>'}</div>`;
}
// --- Pagamento da fatura: confirma e lança a saída na categoria "Cartão" (1 lançamento por cartão/mês) ---
const payRef=(cid,i)=>'fat:'+cid+':'+i;
function payInvoice(cid){
 const c=cardOf(cid),ref=payRef(cid,cur),ex=S.tx.find(x=>x.ref===ref);
 if(ex){
  if(confirm('Desfazer o pagamento da fatura '+BRANDS[c.brand].n+' ('+mlabel(cur)+')?\n\nO lançamento de saída será removido.')){S.tx=S.tx.filter(x=>x.ref!==ref);save();render()}
  return;
 }
 const inv=invoice(cur,cid);if(!(inv.t>0))return;
 if(!confirm('Confirmar o pagamento da fatura '+BRANDS[c.brand].n+' de '+MN[cur%12]+'?\n\n'+BRL.format(inv.t)+' vai como saída na categoria “Cartão”.'))
  return;
 const d0=ix(today())===cur?today():(()=>{const d=dd(cur,Math.min(c.due,dim(cur)));return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)})();
 S.tx.push({id:Date.now(),type:'out',name:'Pagamento fatura '+BRANDS[c.brand].n,amt:inv.t,cat:'Cartão',date:d0,ref});
 save();render();
}
function cardTab(){
 const c=cardOf(cc);if(!c)return mbar()+'<h1>Cartões</h1><div class="cd"><div class="em">Escolha entre Neon, PicPay e Mercado Pago para começar.</div></div><button class="b p w" onclick="cardSheet()">'+ico('add-outline',18)+' Adicionar cartão</button>';const inv=invoice(cur,c.id),run=S.buys.filter(b=>b.cid==c.id&&b.n>1&&first(b)+b.n-1>=cur).sort((a,b)=>(first(a)+a.n)-(first(b)+b.n));const paid=!!S.tx.find(x=>x.ref===payRef(c.id,cur));
 return mbar()+`<div class="cs">${S.cards.map(x=>`<button class="${x.id==c.id?'on':''}" style="background:${BRANDS[x.brand].bg};color:${BRANDS[x.brand].fg}" onclick="cc=${x.id};render()">${BRANDS[x.brand].n.split(' ')[0]}</button>`).join('')}<button onclick="cardSheet()" style="background:var(--sf);color:var(--ink);border:1px dashed var(--mut)">${ico('add-outline',13)} Cartão</button></div>
 <div class="cc" style="background:${BRANDS[c.brand].bg};color:${BRANDS[c.brand].fg}" onclick="cardSheet(${c.id})"><div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="bn">${BRANDS[c.brand].n}</span><span style="font-size:12px;opacity:.8">toque para editar</span></div><div class="ch"></div><div class="ft"><div>Fatura de ${MN[cur%12]}${paid?'<span style="font-weight:700"> · paga</span>':''}<b>${BRL.format(inv.t)}</b></div><div style="text-align:right">Fecha ${fd(closeD(cur,c))}<br>Vence ${fd(dueD(cur,c))}</div></div></div>
 ${inv.t>0?(paid?`<button class="b w" style="margin-bottom:12px;color:var(--ok)" onclick="payInvoice(${c.id})">${ico('checkmark-outline',18)} Fatura paga · toque para desfazer</button>`:`<button class="b p w" style="margin-bottom:12px" onclick="payInvoice(${c.id})">${ico('checkmark-outline',18)} Confirmar pagamento · ${BRL.format(inv.t)}</button>`):''}
 ${c.limit>0?(()=>{const u=used(c),r=c.limit-u;return`<div class="cd"><div style="display:flex;justify-content:space-between"><span>Limite disponível</span><b class="${r>=0?'in':'out'}">${BRL.format(r)}</b></div><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,u/c.limit*100)}%;background:${u/c.limit>.8?'var(--ex)':'var(--ok)'}"></i></div><div class="mu">Usado ${BRL.format(u)} de ${BRL.format(c.limit)}</div></div>`})():'<div class="cd"><div class="em">Toque no cartão para definir o limite.</div></div>'}
 
 <button class="b p w" onclick="buySheet()">${ico('add-outline',18)} Nova compra no cartão</button>
 <h3>Nesta fatura</h3><div class="cd">${inv.it.length?inv.it.map(({b,k,v})=>`<div class="r" onclick="buySheet(${b.id})"><div class="t"><div>${esc(b.name)}</div><div class="mu">${b.n>1?`Parcela ${k+1} de ${b.n}`:'À vista'} · comprado em ${fd(new Date(b.date+'T12:00'))}</div></div><div class="v">${BRL.format(v)}</div></div>`).join(''):'<div class="em">Nenhuma compra nesta fatura.</div>'}</div>
 <h3>Parcelamentos em andamento</h3><div class="cd">${run.length?run.map(b=>{const l=first(b)+b.n-1;return`<div class="r" onclick="buySheet(${b.id})"><div class="t"><div>${esc(b.name)} · ${b.n}x de ${BRL.format(part(b,0))}</div><div class="mu">Última parcela na fatura de ${MN[l%12]}/${Math.floor(l/12)}, que fecha em ${fd(closeD(l,c),1)}</div></div></div>`}).join(''):'<div class="em">Nenhuma compra parcelada em andamento.</div>'}</div>`;
}
function agenda(){
 const up=upcoming(),rest=S.ev.filter(e=>!up.includes(e)).sort((a,b)=>b.date.localeCompare(a.date));
 return`<h1>Agenda</h1><button class="b p w" onclick="evSheet()">${ico('add-outline',18)} Novo compromisso</button><h3>Próximos</h3><div class="cd">${up.length?up.map(evRow).join(''):'<div class="em">Nenhum compromisso marcado.</div>'}</div>${rest.length?`<h3>Concluídos e passados</h3><div class="cd">${rest.map(evRow).join('')}</div>`:''}`;
}
function hist(){
 const n=now.getFullYear()*12+now.getMonth(),all=[];
 for(let i=n;i>n-12;i--){const l=S.tx.filter(x=>ix(x.date)==i),f=S.cards.reduce((s,c)=>s+invoice(i,c.id).t,0);all.push({i,in:sum(l,'in'),out:sum(l,'out'),f,has:l.length>0||f>0})}
 const ch=all.slice(0,6).reverse(),mx=Math.max(1,...ch.map(m=>Math.max(m.in,m.out))),rows=all.filter(m=>m.has);
 return`<h1>Histórico</h1><div class="cd"><div class="mu" style="margin-bottom:10px"><b class="in">■ Entradas</b> &nbsp; <b class="out">■ Saídas</b> · últimos 6 meses</div>${lineChart(ch,mx)}</div>
 <h3>Mês a mês</h3><div class="cd">${rows.length?rows.map(m=>{const b=m.in-m.out;return`<div class="r" onclick="cur=${m.i};tab='tx';render()"><div class="t"><div style="text-transform:capitalize">${mlabel(m.i)}</div><div class="mu">Entrou ${BRL.format(m.in)} · Saiu ${BRL.format(m.out)}${m.f?' · Fatura '+BRL.format(m.f):''}</div></div><div class="v ${b>=0?'in':'out'}">${BRL.format(b)}</div></div>`}).join(''):'<div class="em">Quando você registrar lançamentos, o histórico de cada mês aparece aqui.</div>'}</div>
 
 <h3>Configurações & Backup</h3>
 <div class="cd">
  <button class="b w" onclick="cycleTheme()" style="margin-bottom:10px">${ico('color-palette-outline',18)} Tema: <b>${themeLabel()}</b> <span class="mu" style="font-weight:400">· toque para trocar</span></button>
  <button class="b w" onclick="exportBackup()" style="margin-bottom:10px">${ico('cloud-download-outline',18)} Fazer Backup dos Dados (JSON)</button>
  <button class="b w" onclick="importBackup()" style="margin-bottom:10px">${ico('cloud-upload-outline',18)} Restaurar Backup</button>
  <button class="b w" onclick="budSheet()" style="margin-bottom:10px">${ico('wallet-outline',18)} Orçamento por categoria</button>
  <button class="b w" onclick="histVerSheet()" style="margin-bottom:10px">${ico('time-outline',18)} Histórico de versões (desfazer)</button>
  <button class="b w" onclick="lockSheet()" style="margin-bottom:10px">${ico('lock-closed-outline',18)} ${lockCfg()?'Bloqueio por PIN (ativo)':'Ativar bloqueio por PIN'}</button>
  <div class="mu">Baixe um arquivo com todos os seus lançamentos, cartões e compromissos para garantir a segurança das suas informações.</div>
 </div>
 ${jsHtml()}${jsCfg()?`<details style="margin-top:12px"><summary class="mu" style="cursor:pointer">Outras formas: Google Drive</summary>${driveHtml()}</details>`:driveHtml()}${syncCfg()?syncHtml():`<details style="margin-top:12px"><summary class="mu" style="cursor:pointer">Outras formas: sincronizar com GitHub</summary>${syncHtml()}</details>`}`;
}
function render(){
 $('#app').innerHTML={home,tx:txTab,hist,card:cardTab,ag:agenda}[tab]();
 $('#nav').innerHTML=[['home','Resumo','pie-chart-outline'],['hist','Histórico','time-outline'],['tx','Lançamentos','cash-outline'],['card','Cartão','card-outline'],['ag','Agenda','calendar-outline']].map(([k,t,ic])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${ico(ic,22)}<span class="lbl">${t}</span></button>`).join('');
}
applyTheme();render();
// Captura automática: verifica notificações pendentes periodicamente
setInterval(pullNotifs,5000);
setTimeout(pullNotifs,2500);
function onBack(){if(window.AndroidBridge){pullNotifs();if($('#ov').hidden)render()}autoSync()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)onBack();else{autoSync();if(lockCfg())lockShow()}});
window.addEventListener('focus',onBack);
// PWA: manifest + service worker só no web de verdade (fora do app Android e fora de file://)
if(location.protocol.startsWith('http') && !window.Capacitor && !window.cordova){
  const lm=document.createElement('link');lm.rel='manifest';lm.href='manifest.webmanifest';document.head.appendChild(lm);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// Sincronização: atualiza a nuvem imediatamente ao abrir o app (se conectado)
if(syncCfg()||driveCfg()||jsCfg())autoSync();
// Bloqueio por PIN: pede o PIN logo na abertura (se ativado neste aparelho)
if(lockCfg())lockShow();

// Pull-to-refresh
let touchStartY = 0;
document.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
document.addEventListener('touchend', e => {
  if (window.scrollY === 0 && e.changedTouches[0].clientY - touchStartY > 100) {
    if(syncCfg()||driveCfg()||jsCfg()){syncNowUI();alert('Atualizando dados...');}
  }
});
</script>
</body>
</html>
